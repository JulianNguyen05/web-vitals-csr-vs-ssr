# Cổng 80: chỉ phục vụ xác minh Let's Encrypt và chuyển hướng sang HTTPS.
# Chỉ IPv4: VPS có IPv4 riêng, không có bản ghi AAAA; một số VPS tắt hẳn IPv6 khiến "listen [::]" làm Nginx không khởi động được.
server {
    listen 80;
    server_name __CSR_HOST__ __SSR_HOST__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
