# Dùng CHUNG cho cả 2 bản (include trong từng server) → TLS, HTTP/2, nén giống hệt nhau.
ssl_certificate     /etc/letsencrypt/live/tqmart/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/tqmart/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:TQSSL:10m;
ssl_session_timeout 1d;

# Nén: Nginx nén cho CẢ HAI bản cùng 1 mức (Next.js đã tắt nén riêng: compress: false).
gzip on;
gzip_vary on;
gzip_proxied any;          # nén cả phản hồi đi qua proxy (bản SSR)
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript text/javascript application/json
           text/x-component image/svg+xml;   # text/html luôn được nén mặc định

access_log /var/log/nginx/tqmart.access.log;
