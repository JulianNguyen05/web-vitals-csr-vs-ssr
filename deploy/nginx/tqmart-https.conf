# ---------------------------------------------------------------------------
# Bản CSR (__CSR_HOST__): file tĩnh do Nginx phục vụ trực tiếp.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name __CSR_HOST__;
    include /etc/nginx/snippets/tqmart-common.conf;

    root /var/www/tqmart-csr;

    # JS/CSS có hash trong tên file → cache lâu dài (giống /_next/static của bản SSR)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    # Mọi đường dẫn khác (/, /products/..., /cart) → index.html (SPA)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}

# ---------------------------------------------------------------------------
# Bản SSR (__SSR_HOST__): HTML do Next.js render mỗi request (pm2, 127.0.0.1:3001).
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name __SSR_HOST__;
    include /etc/nginx/snippets/tqmart-common.conf;

    # JS/CSS tĩnh: Nginx phục vụ trực tiếp như bản CSR, không đi qua Node.js
    location /_next/static/ {
        alias __APP_DIR__/apps/app-ssr/.next/static/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Không gom phản hồi: HTML stream thẳng tới trình duyệt ngay khi Next.js render
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
